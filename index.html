  <script id="birthday-config" type="application/json">{"name": "Aroohi", "from": "Aahil", "intro": "AROOHIII! This is YOUR birthday universe: ten stops, a very suspicious pigeon, a tiny original birthday beat, one apology flower, and a final letter I really wanted you to read. Ready for the chaos? 🎁", "memories": ["The car-window incident 🚗 I had gone to buy you something. When I came back, I put my face RIGHT next to your window and scared you so much. The flower was my apology. I am still sorryyy 🌸", "The pre-event rescue 💆 My hair had its own plans the night before an event. You gave me a head massage, and the next day I felt ready to go. How did you DO that??", "Your music-and-meme corner 🎧 Limp Bizkit belongs on your playlist, and the AI pigeon meme from Instagram absolutely belongs in this tiny birthday universe."], "chapterNotes": ["Aroohi, do not worry: these stars are MUCH less likely to jumpscare you than I was at the car window. — Aahil", "I have brought the car-window flower AND the legendary hair rescue into our tiny scrapbook. Yes, I remember both. — Aahil", "The cake is yours to design. Consider it my second apology for the window incident, after the flower. — Aahil", "A flower for the bouquet... and one very specific flower for my car-window apology. 🌸 — Aahil", "Postcards for the girl with the Limp Bizkit playlist and the internet's most unexpected pigeon. — Aahil", "The balloons are about to reveal your name. I asked them to keep your nickname a secret. They did not listen. — Aahil", "I made an ORIGINAL tiny beat for your music-loving self. No, it is not Limp Bizkit. I know my limits 😂 — Aahil", "Your birthday world can have a concert, a flower shop, or the headquarters of that ridiculous AI pigeon. — Aahil", "The birthday committee is asking VERY important questions about flowers, hair rescues, and pigeons. — Aahil", "One last constellation for you, Aroohi. I saved the longest message for the endddd. — Aahil"], "postcards": ["From the car-window universe: nobody is allowed to jumpscare you today. Flowers are permitted. 🌸", "From your next event: may every hair-related emergency be solved by your mysterious head-massage superpower. 💆", "From your future playlist: more songs you LOVE, more loud moments, and a place for Limp Bizkit. 🎧", "From pigeon headquarters: the AI pigeon has approved this birthday message. We do not know who gave it that authority. 🐦"], "finalNote": "AROOHIII,\n\nHAPPYYYY BIRTHDAYYYY!!! 🎉🎂✨\n\nOkay, first of all: YES, I really made you an entire ten-chapter birthday game. I was going to write you a normal message, but then I thought that was FAR too sensible. A proper birthday message for you clearly needed stars, a cake you could design, flowers, balloons, a questionable quiz, a little music game, and a pigeon that has absolutely no business being here. So here we areee. I hope you had fun getting all the way to this letter.\n\nI had to put the car-window story in here because I still cannot believe I did that 😭. I got out of the car to buy you something, came back, and somehow decided the best way to announce my return was to put my face RIGHT next to your window. You saw me and got so scared. I felt SO bad. The flower I gave you as an apology was very real, but I am now adding a second, extremely over-the-top apology in the form of this whole birthday universe. Please note that this game contains zero surprise faces at car windows. I have learned my lessonnn.\n\nAnd then there was the day before my event when my hair was just refusing to cooperate. You gave me a head massage, and somehow the next day I felt ready to go. I still do not understand the science behind that. I am choosing to believe you unlocked some secret power that the rest of us have not been told about. That memory makes me laugh, but it also reminds me of something genuinely good: you took a little stressful moment and made it easier. Thank you for that.\n\nI wanted the game to sound a bit like your world, too. Obviously, there had to be music, because you LOVE it. I know my tiny made-up birthday beat is not exactly Limp Bizkit, but at least it is an original soundtrack to your own ridiculous adventure. And the AI pigeon meme on Instagram HAD to make an appearance. I cannot fully explain why a pigeon deserves a place in a birthday game, but honestly, the more I thought about it, the more correct it felt. It is weird, it is funny, and that is enough for meee 🐦.\n\nI also wanted the game to remind you that birthdays are made of more than one big moment. Sometimes it is the song you play again. Sometimes it is a flower after a very unnecessary jumpscare. Sometimes it is the random story you end up telling months later and laughing about AGAIN. All those small, odd, happy little pieces count. I hope this year gives you more of them than you can keep track of.\n\nI hope you get days that feel exciting, and ordinary days that still have something lovely tucked into them. I hope you find new music you cannot stop playing, jokes that make absolutely no sense to anyone else, chances to try things you have been curious about, and those moments where you suddenly realize, “WAIT, this is actually a really good day.” I hope you feel proud of the small wins as well as the huge ones. And I hope you get to make choices that feel like YOUR choices, just like you did in your tiny birthday universe.\n\nThank you for the stories we already have: the car-window scare, the apology flower, and the totally unexplained hair rescue. I am looking forward to the new funny stories we have not even stumbled into yet. Today, though, your only assignment is to enjoy YOUR birthday. Accept your imaginary crown. Play the loud music. Laugh at your favorite chaotic pigeon. Have the cake exactly how you want it. You have earned a day that feels completely youuu.\n\nSo, from the very bottom of this extremely serious, scientifically accurate birthday game: HAPPYYYY BIRTHDAYYYY, AROOHIII!!! Have the BESTTT day and a year full of music, laughs, flowers, good surprises, and a reasonable number of pigeons.\n\nAnd since you gave me the nickname, I have to say it at least once: HAPPYYYY BIRTHDAY, PICK ME KUTTIYAAA!!! 😂✨\n\nFrom Aahil", "nickname": "Pick Me Kuttiya"}</script>
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar"><div class="brand">✦ A LITTLE BIRTHDAY UNIVERSE</div><div class="top-actions"><button class="tiny-btn creator" id="editBtn" type="button">✏️ Edit story</button><button class="tiny-btn" id="soundBtn" type="button" aria-pressed="false">♫ Sound off</button></div></header>
    <div class="progress-wrap" id="progress"></div>
    <main class="scene" id="app" aria-live="polite"></main>
    <footer>Made with a little imagination and a lot of birthday confetti ✨</footer>
  </div>
  <script>
  (() => {
    'use strict';
    const $ = (s, root=document) => root.querySelector(s);
    const app = $('#app');
    const configNode = $('#birthday-config');
    const defaults = JSON.parse(configNode.textContent);
    let config = {...defaults};
    const key = 'aroohi-birthday-quest-v2';
    const initial = {stage:0, stars:0, choices:{base:0,icing:0,topper:0}, flowers:[], postcards:[], balloons:[], rhythmStep:0, pathChoices:[], quizStep:0, line:0};
    let state;
    try { state = {...initial, ...JSON.parse(localStorage.getItem(key) || '{}')}; } catch { state={...initial}; }
    if (!Number.isInteger(state.stage) || state.stage<0 || state.stage>11) state={...initial};
    state.choices={...initial.choices,...state.choices};
    for (const field of ['flowers','postcards','balloons','pathChoices']) if (!Array.isArray(state[field])) state[field]=[];
    let sound=false, audioContext=null, busy=false, flipped=[], matched=[], memoryDeck=[], memoryMessage='';
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const escapeHTML = (v) => String(v ?? '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const base=[{name:'Vanilla',color:'#ebc88a',emoji:'🍰'},{name:'Chocolate',color:'#a56e60',emoji:'🍫'},{name:'Strawberry',color:'#f5a2ab',emoji:'🍓'}];
    const icing=[{name:'Pink',color:'#ffb1d1'},{name:'Lavender',color:'#c6aeeb'},{name:'Cream',color:'#fff1d0'}];
    const topper=[{name:'Star',emoji:'⭐'},{name:'Cherry',emoji:'🍒'},{name:'Flower',emoji:'🌼'}];
    const flowers=[{name:'Joy',emoji:'🌻'},{name:'Curiosity',emoji:'🌷'},{name:'Kindness',emoji:'🌸'},{name:'Courage',emoji:'🌺'},{name:'Laughter',emoji:'🌼'},{name:'Wonder',emoji:'🪻'}];
    const points=[[65,211],[159,64],[248,179],[342,70],[438,207]];
    function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{}}
    function tone(freq=620,duration=.12){if(!sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,audioContext.currentTime);gain.gain.setValueAtTime(.08,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);osc.connect(gain).connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration)}catch{}}
    function melody(){[523,659,784,1046].forEach((freq,i)=>setTimeout(()=>tone(freq,.24),i*170));}
    function confetti(amount=65){if(reduceMotion)return;const layer=$('#confetti');layer.innerHTML='';for(let i=0;i<amount;i++){const piece=document.createElement('i');piece.style.cssText=`--x:${Math.random()*100}%;--c:${['#ffd879','#fac2d8','#bfe6d7','#c6b1fa','#fff6e4'][i%5]};--t:${3+Math.random()*3}s;--r:${Math.random()*360}deg;--drift:${Math.random()*200-100}px;animation-delay:${Math.random()*.7}s`;layer.appendChild(piece)}setTimeout(()=>layer.replaceChildren(),6800)}
    function goto(stage){state.stage=stage;save();render();window.scrollTo({top:0,behavior:reduceMotion?'instant':'smooth'});tone(780);if(stage===11){confetti(150);melody()}}
    function progress(){const labels=['Stars','Memories','Cake','Garden','Postcards','Balloons','Music','Choices','Quiz','Sky'];$('#progress').innerHTML=state.stage===0?'':`<div class="progress" aria-label="Journey progress">${labels.map((label,i)=>`<div class="step ${state.stage>i+1?'done':state.stage===i+1?'on':''}" ${state.stage===i+1?'aria-current="step"':''}><b>${state.stage>i+1?'✓':['✦','▣','♨','✿','✉','●','♫','◇','?','✧'][i]}</b><span>${label}</span></div>`).join('')}</div>`}
    function scene(inner,extra=''){app.innerHTML=`<section class="paper ${extra}"><div class="paper-inner">${inner}</div></section>`;progress()}
    function chapterHead(number,title,lead){return `<div class="chapter-head"><p class="eyebrow">Chapter ${number} of 10 · ${escapeHTML(config.name)}'s birthday quest</p><h1 class="heading">${title}</h1><p class="lead">${lead}</p></div>`}
    function creatorNote(index){return `<p class="creator-note"><span aria-hidden="true">💬</span> ${escapeHTML(config.chapterNotes?.[index]||'A little birthday note for you.')} </p>`}
    function continueButton(label,next,ready){return `<div class="action-footer"><span class="note">${ready?'A little piece of the surprise is yours. ✨':'Take your time. The universe can wait.'}</span><button class="btn" id="next" type="button" ${ready?'':'disabled'}>${label} <span aria-hidden="true">↗</span></button></div>`}
    function render(){
      if(state.stage===0) return cover();
      if(state.stage===1) return stars();
      if(state.stage===2) return memories();
      if(state.stage===3) return cake();
      if(state.stage===4) return garden();
      if(state.stage===5) return postcardsGame();
      if(state.stage===6) return balloonGame();
      if(state.stage===7) return rhythmGame();
      if(state.stage===8) return chooseStory();
      if(state.stage===9) return quizGame();
      if(state.stage===10) return skyGame();
      return ending();
    }
    function cover(){scene(`<div class="hero-grid"><div class="hero-text"><p class="eyebrow">An invitation, just for you ✉️</p><h1 class="display">Happy birthday,<br><em>${escapeHTML(config.name)}.</em></h1><p class="lead">${escapeHTML(config.intro)}</p><div class="tag">✦ 10 playful chapters · ✧ 1 big surprise</div><div class="btn-row"><button class="btn" id="start" type="button">Open your adventure <span aria-hidden="true">→</span></button></div><p class="note" id="pigeonMessage">Headphones optional. Smiling encouraged. Also, tap the pigeon.</p></div><div class="hero-art" role="img" aria-label="A pastel planet surrounded by birthday stars"><div class="orbit"></div><div class="planet">🎁</div><div class="floating float-a">💫</div><div class="floating float-b">🎈</div><button class="floating float-c pigeon-cameo" id="pigeon" type="button" aria-label="Ask the birthday pigeon">🐦</button></div></div>`);$('#start').onclick=()=>goto(1);$('#pigeon').onclick=()=>{$('#pigeonMessage').textContent=`Pigeon HQ confirms: HAPPYYYY BIRTHDAY, ${config.name.toUpperCase()}! 🐦`;tone(850,.2);confetti(24)}}
    function stars(){const ready=state.stars>=5;scene(`${chapterHead('01','The sky is missing its sparkle','Five tiny stars wandered away while getting ready for your birthday. Tap them to bring the night back to life.')}<div class="chapter-grid"><div class="game-panel"><div class="score" id="starScore">${Math.min(state.stars,5)} / 5 stars found</div><div class="sparkles" aria-label="Star collecting game">${[[11,17],[68,12],[45,56],[78,65],[15,72]].map((p,i)=>`<button class="sparkle-btn ${i<state.stars?'collected':''}" style="left:${p[0]}%;top:${p[1]}%" data-star="${i}" type="button" aria-label="Collect star ${i+1}" ${i<state.stars?'disabled':''}>⭐</button>`).join('')}</div><div class="hint">Psst... every good story begins with a little bit of light.</div></div><div><div style="font-size:7rem;text-align:center" aria-hidden="true">🌌</div><p class="lead">The stars light up one by one. Somehow, the sky already looks more like a celebration.</p><div class="success" id="starSuccess">${ready?'You found them all! The path to the next little surprise is glowing.':''}</div></div></div>${creatorNote(0)}${continueButton('Follow the trail',2,ready)}`,'chapter');app.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add('collected');state.stars++;save();tone(450+state.stars*75);$('#starScore').textContent=`${state.stars} / 5 stars found`;if(state.stars>=5){$('#starSuccess').textContent='You found them all! The path to the next little surprise is glowing.';$('#next').disabled=false;confetti(32)}});$('#next').onclick=()=>goto(2)}
    function memories(){matched=[];flipped=[];busy=false;memoryMessage='';memoryDeck=[0,0,1,1,2,2].sort(()=>Math.random()-.5);drawMemories()}
    function drawMemories(){const icons=['🚗','💆','🎧'];const done=matched.length===3;scene(`${chapterHead('02','A pocketful of moments','Match the little keepsakes. Every pair reveals a note tucked away for you.')}<div class="chapter-grid"><div class="game-panel"><div class="score" id="pairScore">${matched.length} / 3 pairs found</div><div class="cards">${memoryDeck.map((id,i)=>`<button class="memory-card ${matched.includes(id)||flipped.includes(i)?'open':''} ${matched.includes(id)?'matched':''}" data-card="${i}" type="button" aria-label="${matched.includes(id)||flipped.includes(i)?icons[id]:'Turn over memory card '+(i+1)}" ${matched.includes(id)?'disabled':''}>${matched.includes(id)||flipped.includes(i)?icons[id]:'✦'}</button>`).join('')}</div><div class="memory-log" id="memoryLog" aria-live="polite">${escapeHTML(memoryMessage||'Choose two cards to turn over.')}</div></div><div><div style="font-size:7rem;text-align:center" aria-hidden="true">💌</div><p class="lead">The nicest things are often tucked into the ordinary moments.</p><div class="success" id="pairSuccess">${done?'All the keepsakes are together. Next stop: something delicious.':''}</div></div></div>${creatorNote(1)}${continueButton('Visit the cake studio',3,done)}`,'chapter');app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>flipCard(Number(b.dataset.card)));$('#next').onclick=()=>goto(3)}
    function flipCard(index){if(busy||matched.includes(memoryDeck[index])||flipped.includes(index))return;flipped.push(index);tone(540);const b=app.querySelector(`[data-card="${index}"]`);b.classList.add('open');b.textContent=['🚗','💆','🎧'][memoryDeck[index]];b.setAttribute('aria-label',b.textContent);if(flipped.length<2)return;busy=true;const [a,c]=flipped;if(memoryDeck[a]===memoryDeck[c]){const id=memoryDeck[a];matched.push(id);memoryMessage=config.memories[id]||'';$('#memoryLog').textContent=memoryMessage;$('#pairScore').textContent=`${matched.length} / 3 pairs found`;flipped=[];busy=false;app.querySelectorAll('[data-card]').forEach(x=>{if(memoryDeck[Number(x.dataset.card)]===id){x.classList.add('matched');x.disabled=true}});tone(800,.22);if(matched.length===3){$('#pairSuccess').textContent='All the keepsakes are together. Next stop: something delicious.';$('#next').disabled=false;confetti(40)}}else{memoryMessage='Not a pair yet. Try another little combination!';$('#memoryLog').textContent=memoryMessage;setTimeout(()=>{if(state.stage!==2)return;for(const i of [a,c]){const card=app.querySelector(`[data-card="${i}"]`);if(card){card.classList.remove('open');card.textContent='✦';card.setAttribute('aria-label',`Turn over memory card ${i+1}`)}}flipped=[];busy=false},780)}}
    function cakeVisual(){return `<div class="cake" style="--cake:${base[state.choices.base].color};--icing:${icing[state.choices.icing].color}"><div class="cake-plate"></div><div class="cake-base"></div><div class="cake-icing"></div><div class="cake-topper">${topper[state.choices.topper].emoji}</div></div>`}
    function cake(){scene(`${chapterHead('03','The cake studio','An excellent birthday deserves a cake with your own creative twist. Pick a flavor, icing, and a topper.')}<div class="chapter-grid"><div class="game-panel"><div class="score">Design your birthday cake 🎂</div><p class="opt-label">Cake flavor</p><div class="options" role="group" aria-label="Cake flavor">${base.map((x,i)=>`<button class="option ${state.choices.base===i?'selected':''}" data-choice="base" data-value="${i}" type="button" aria-pressed="${state.choices.base===i}">${x.emoji} ${x.name}</button>`).join('')}</div><p class="opt-label">Icing color</p><div class="options" role="group" aria-label="Icing color">${icing.map((x,i)=>`<button class="option ${state.choices.icing===i?'selected':''}" data-choice="icing" data-value="${i}" type="button" aria-pressed="${state.choices.icing===i}">${['🩷','💜','🤍'][i]} ${x.name}</button>`).join('')}</div><p class="opt-label">The finishing touch</p><div class="options" role="group" aria-label="Cake topper">${topper.map((x,i)=>`<button class="option ${state.choices.topper===i?'selected':''}" data-choice="topper" data-value="${i}" type="button" aria-pressed="${state.choices.topper===i}">${x.emoji} ${x.name}</button>`).join('')}</div></div><div><div class="cake-area" id="cakeArea" aria-label="Your decorated birthday cake" role="img">${cakeVisual()}</div><p class="note">A perfect choice. Actually, every combination is a perfect choice.</p></div></div>${creatorNote(2)}${continueButton('Make a wish and continue',4,true)}`,'chapter');app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const kind=b.dataset.choice;state.choices[kind]=Number(b.dataset.value);save();app.querySelectorAll(`[data-choice="${kind}"]`).forEach(x=>{const yes=x===b;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',String(yes))});$('#cakeArea').innerHTML=cakeVisual();tone(620+Number(b.dataset.value)*90)});$('#next').onclick=()=>{confetti(45);goto(4)}}
    function garden(){const ready=state.flowers.length>=3;scene(`${chapterHead('04','The garden of good things','Pick three flowers to fill a tiny birthday bouquet. There are no wrong choices, only different kinds of lovely.')}<div class="chapter-grid"><div class="game-panel"><div class="score" id="flowerScore">${state.flowers.length} / 3 flowers picked</div><div class="garden">${flowers.map((x,i)=>`<button class="flower ${state.flowers.includes(i)?'picked':''}" data-flower="${i}" type="button" aria-pressed="${state.flowers.includes(i)}" ${ready&&!state.flowers.includes(i)?'disabled':''}><span>${x.emoji}</span>${x.name}</button>`).join('')}</div><div class="flowers-selected" id="flowersSelected">${ready?'Your bouquet: '+state.flowers.map(i=>flowers[i].name).join(' · '):'Choose three for your bouquet.'}</div></div><div><div style="font-size:7rem;text-align:center" aria-hidden="true">🪴</div><p class="lead">One flower for a wish. One for a smile. And one for all the things you have yet to discover.</p><div class="success" id="flowerSuccess">${ready?'The bouquet is ready. A mailbox has appeared at the edge of the garden.':''}</div></div></div>${creatorNote(3)}${continueButton('Open the mailbox',5,ready)}`,'chapter');app.querySelectorAll('[data-flower]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.flower);if(state.flowers.includes(i)||state.flowers.length>=3)return;state.flowers.push(i);save();b.classList.add('picked');b.setAttribute('aria-pressed','true');tone(500+state.flowers.length*100);$('#flowerScore').textContent=`${state.flowers.length} / 3 flowers picked`;if(state.flowers.length>=3){$('#flowersSelected').textContent='Your bouquet: '+state.flowers.map(i=>flowers[i].name).join(' · ');$('#flowerSuccess').textContent='The bouquet is ready. A mailbox has appeared at the edge of the garden.';$('#next').disabled=false;app.querySelectorAll('[data-flower]').forEach(x=>{if(!x.classList.contains('picked'))x.disabled=true})}});$('#next').onclick=()=>goto(5)}
    function postcardsGame(){
      const icons=['🌤️','🎡','🌙','🎉'];
      const ready=state.postcards.length>=3;
      scene(`${chapterHead('05','The postcard mailbox','Four postcards arrived from possible days ahead. Open at least three to read the tiny wishes they carry.')}
        <div class="game-panel"><div class="score" id="postcardScore">${state.postcards.length} / 3 postcards opened</div>
        <div class="postcard-grid">${icons.map((icon,i)=>`<button type="button" class="postcard ${state.postcards.includes(i)?'opened':''}" data-postcard="${i}" ${state.postcards.includes(i)?'disabled':''} aria-label="${state.postcards.includes(i)?'Opened postcard':'Open postcard '+(i+1)}"><span class="postcard-icon">${state.postcards.includes(i)?icon:'✉️'}</span><span>${state.postcards.includes(i)?escapeHTML(config.postcards?.[i]||'A little wish for you.'):['Tomorrow','Next month','Somewhere far away','Right now'][i]}</span></button>`).join('')}</div></div>
        ${creatorNote(4)}${continueButton('Join the balloon parade',6,ready)}`,'chapter');
      app.querySelectorAll('[data-postcard]').forEach(button=>button.onclick=()=>{
        const i=Number(button.dataset.postcard);
        if(state.postcards.includes(i))return;
        state.postcards.push(i);save();tone(640+i*65);
        button.classList.add('opened');button.disabled=true;button.setAttribute('aria-label','Opened postcard');
        button.innerHTML=`<span class="postcard-icon">${icons[i]}</span><span>${escapeHTML(config.postcards?.[i]||'A little wish for you.')}</span>`;
        $('#postcardScore').textContent=`${state.postcards.length} / 3 postcards opened`;
        if(state.postcards.length>=3)$('#next').disabled=false;
      });
      $('#next').onclick=()=>goto(6);
    }
    function balloonGame(){
      const letters=[...config.name.replace(/\s+/g,'')].slice(0,12);
      const balloonReveal=`Surprise! The parade says ${config.name}${config.nickname?', a.k.a. '+config.nickname:''}!`;
      const ready=state.balloons.length>=letters.length;
      scene(`${chapterHead('06','The balloon parade','These balloons are hiding a VERY familiar name. Pop them all to reveal it, one letter at a time.')}
        <div class="game-panel"><div class="score" id="balloonScore">${state.balloons.length} / ${letters.length} balloons popped</div>
        <div class="balloon-grid">${letters.map((letter,i)=>`<button type="button" class="balloon balloon-${i%4} ${state.balloons.includes(i)?'popped':''}" data-balloon="${i}" ${state.balloons.includes(i)?'disabled':''} aria-label="${state.balloons.includes(i)?'Letter '+escapeHTML(letter):'Pop balloon '+(i+1)}">${state.balloons.includes(i)?escapeHTML(letter):'🎈'}</button>`).join('')}</div>
        <p class="balloon-word" id="balloonWord">${ready?escapeHTML(balloonReveal):'One little pop at a time... ✨'}</p></div>
        ${creatorNote(5)}${continueButton('Find the birthday beat',7,ready)}`,'chapter');
      app.querySelectorAll('[data-balloon]').forEach(button=>button.onclick=()=>{
        const i=Number(button.dataset.balloon);if(state.balloons.includes(i))return;
        state.balloons.push(i);save();tone(680+i*38);
        button.classList.add('popped');button.textContent=letters[i];button.disabled=true;
        button.setAttribute('aria-label','Letter '+letters[i]);
        $('#balloonScore').textContent=`${state.balloons.length} / ${letters.length} balloons popped`;
        if(state.balloons.length>=letters.length){$('#balloonWord').textContent=balloonReveal;$('#next').disabled=false;confetti(45)}
      });
      $('#next').onclick=()=>goto(7);
    }
    const birthdayBeat=[0,2,1,3,0];
    const beatNotes=[{emoji:'🟡',freq:523},{emoji:'🔵',freq:659},{emoji:'🟣',freq:784},{emoji:'🟢',freq:880}];
    function rhythmGame(){
      const ready=state.rhythmStep>=birthdayBeat.length;
      scene(`${chapterHead('07','The birthday beat','An original little beat for your music-loving self, Aroohi. It is definitely not Limp Bizkit, but it IS yours. Watch the color pattern and play it back.')}
        <div class="game-panel"><div class="score" id="beatScore">${Math.min(state.rhythmStep,5)} / 5 notes played</div>
        <div class="beat-pattern" aria-label="Pattern: yellow, purple, blue, green, yellow">🟡 🟣 🔵 🟢 🟡</div>
        <div class="beat-grid">${beatNotes.map((note,i)=>`<button class="beat beat-${i}" data-note="${i}" type="button" aria-label="${['Yellow','Blue','Purple','Green'][i]} note">${note.emoji}</button>`).join('')}</div>
        <div class="hint" id="beatHint">${ready?'You did it. Your birthday beat is complete!':'Next note: '+(state.rhythmStep+1)+' of 5. A wrong note starts the pattern again.'}</div>
        <button type="button" class="tiny-btn preview" id="previewBeat">▶ Play clue</button></div>
        ${creatorNote(6)}${continueButton('Choose your own story',8,ready)}`,'chapter');
      app.querySelectorAll('[data-note]').forEach(button=>button.onclick=()=>{
        if(state.rhythmStep>=birthdayBeat.length)return;
        const n=Number(button.dataset.note);tone(beatNotes[n].freq,.22);
        button.classList.add('lit');setTimeout(()=>button.classList.remove('lit'),250);
        if(n===birthdayBeat[state.rhythmStep]){
          state.rhythmStep++;save();$('#beatScore').textContent=`${state.rhythmStep} / 5 notes played`;
          $('#beatHint').textContent=state.rhythmStep>=5?'You did it. Your birthday beat is complete!':`Nice! Now note ${state.rhythmStep+1} of 5.`;
          if(state.rhythmStep>=5){$('#next').disabled=false;confetti(42)}
        }else{state.rhythmStep=0;save();$('#beatScore').textContent='0 / 5 notes played';$('#beatHint').textContent='Oops, the beat got tangled. Start from yellow 🟡. You can do it!'}
      });
      $('#previewBeat').onclick=()=>birthdayBeat.forEach((n,i)=>setTimeout(()=>{
        if(state.stage!==7)return;
        const button=app.querySelector(`[data-note="${n}"]`);
        if(button){button.classList.add('lit');setTimeout(()=>button.classList.remove('lit'),280)}
        tone(beatNotes[n].freq,.24);
      },i*430));
      $('#next').onclick=()=>goto(8);
    }
    const storyChoices=[
      [{emoji:'🎸',label:'A loud concert'},{emoji:'🌸',label:'A flower market'},{emoji:'🐦',label:'Pigeon headquarters'}],
      [{emoji:'🥁',label:'A dramatic drum solo'},{emoji:'🌷',label:'An apology flower'},{emoji:'👑',label:'A crowned AI pigeon'}],
      [{emoji:'🎟️',label:'A concert ticket'},{emoji:'🎵',label:'A new favorite song'},{emoji:'📸',label:'A story to remember'}]
    ];
    function chooseStory(){
      const round=state.pathChoices.length,ready=round>=3;
      const picked=state.pathChoices.map((choice,i)=>storyChoices[i][choice]);
      scene(`${chapterHead('08','Choose the next page','What would YOUR very own birthday universe look like? Make three choices and watch your little story appear.')}
        <div class="game-panel"><div class="score">${ready?'Your story is written ✨':'Choice '+(round+1)+' of 3'}</div>
        ${ready?`<div class="storybook">And so ${escapeHTML(config.name)} wandered into ${escapeHTML(picked[0].label.toLowerCase())}, discovered ${escapeHTML(picked[1].label.toLowerCase())}, and came home with ${escapeHTML(picked[2].label.toLowerCase())}. The end? Not even close. This is just the beginning. ✨</div>`:
        `<p class="note cream">${['Where does your adventure begin?','What is waiting there?','What do you take home?'][round]}</p><div class="branch-grid">${storyChoices[round].map((choice,i)=>`<button class="branch" type="button" data-branch="${i}"><span>${choice.emoji}</span>${choice.label}</button>`).join('')}</div>`}
        <div class="chosen-path">${picked.map(item=>`<span>${item.emoji} ${escapeHTML(item.label)}</span>`).join('')}</div></div>
        ${creatorNote(7)}${continueButton('Take the very serious quiz',9,ready)}`,'chapter');
      app.querySelectorAll('[data-branch]').forEach(button=>button.onclick=()=>{state.pathChoices.push(Number(button.dataset.branch));save();tone(750);chooseStory()});
      $('#next').onclick=()=>goto(9);
    }
    const quizQuestions=[
      {q:'What did I give you after the legendary car-window jumpscare?',options:['A traffic cone','An apology flower','A formal invoice'],answer:1},
      {q:'What was the mysterious pre-event hair rescue?',options:['Your head massage','A pigeon with a hairbrush','A magic hat'],answer:0},
      {q:'Who is the unofficial mascot of this birthday universe?',options:['An accountant','A moon-shaped potato','That AI pigeon meme'],answer:2}
    ];
    function quizGame(){
      const ready=state.quizStep>=quizQuestions.length,q=quizQuestions[state.quizStep];
      scene(`${chapterHead('09','A VERY serious birthday quiz','Three questions. Absolutely no certificates. Maximum silliness. Pick the answer that feels right.')}
        <div class="game-panel"><div class="score">${ready?'3 / 3 questions answered':`Question ${state.quizStep+1} / 3`}</div>
        ${ready?'<div class="storybook">Official result: 100% birthday adventure expert. There is just one final constellation to finish. 🏆</div>':`<h2 class="quiz-question">${escapeHTML(q.q)}</h2><div class="quiz-options">${q.options.map((option,i)=>`<button class="quiz-option" type="button" data-answer="${i}">${escapeHTML(option)}</button>`).join('')}</div><div class="hint" id="quizHint">Aroohi, trust your extremely scientific instincts.</div>`}</div>
        ${creatorNote(8)}${continueButton('Find the final constellation',10,ready)}`,'chapter');
      app.querySelectorAll('[data-answer]').forEach(button=>button.onclick=()=>{
        const answer=Number(button.dataset.answer);
        if(answer===q.answer){state.quizStep++;save();tone(840,.24);button.classList.add('correct');app.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('#quizHint').textContent='CORRECT! The birthday committee approves. 🎉';setTimeout(()=>{if(state.stage===9)quizGame()},600)}
        else{button.classList.add('incorrect');$('#quizHint').textContent='That would be hilarious, but try another answer 😂';tone(310)}
      });
      $('#next').onclick=()=>goto(10);
    }
    function constellationMarkup(){let lines='';for(let i=1;i<state.line;i++)lines+=`<line x1="${points[i-1][0]}" y1="${points[i-1][1]}" x2="${points[i][0]}" y2="${points[i][1]}"/>`;return `<svg class="constellation" viewBox="0 0 500 280" role="group" aria-label="Connect the stars in order from one to five">${Array.from({length:35},(_,i)=>`<circle class="small-star" cx="${(i*173+49)%490+5}" cy="${(i*97+30)%260+10}" r="${i%4===0?1.8:1}"/>`).join('')}${lines}${points.map((p,i)=>`<g class="star-node ${i<state.line?'visited':''}" data-node="${i}" role="button" tabindex="0" aria-label="Star ${i+1}${i<state.line?', connected':''}" transform="translate(${p[0]} ${p[1]})"><circle r="16"/><text y="1">${i+1}</text></g>`).join('')}</svg>`}
    function skyGame(){const ready=state.line>=5;scene(`${chapterHead('10','The last little light','Connect the five stars in order, from 1 to 5. A new constellation is waiting to be found.')}<div class="chapter-grid"><div class="game-panel"><div class="score" id="skyScore">${Math.min(state.line,5)} / 5 stars connected</div><div id="constellationHolder">${constellationMarkup()}</div><div class="hint" id="skyHint">${ready?'You made it. The surprise is ready to open.':'Start with star '+(state.line+1)+'. Tap the numbers in order.'}</div></div><div><div style="font-size:7rem;text-align:center" aria-hidden="true">✨</div><p class="lead">It turns out the whole sky was getting ready to spell out one thing: today is yours.</p><div class="success" id="skySuccess">${ready?'A new constellation appears: The Aroohi. ✨':''}</div></div></div>${creatorNote(9)}${continueButton('Open your birthday surprise',11,ready)}`,'chapter');bindNodes();$('#next').onclick=()=>goto(11)}
    function bindNodes(){app.querySelectorAll('[data-node]').forEach(node=>{node.onclick=()=>connect(Number(node.dataset.node));node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();connect(Number(node.dataset.node))}}})}
    function connect(index){if(state.line>=5)return;if(index!==state.line){const holder=$('#constellationHolder');holder.classList.remove('shake');void holder.offsetWidth;holder.classList.add('shake');$('#skyHint').textContent=`Look for star ${state.line+1} next. You've got this!`;tone(270);return}state.line++;save();tone(560+state.line*100,.19);$('#constellationHolder').innerHTML=constellationMarkup();bindNodes();$('#skyScore').textContent=`${state.line} / 5 stars connected`;$('#skyHint').textContent=state.line>=5?'You made it. The surprise is ready to open.':`Lovely! Now find star ${state.line+1}.`;if(state.line>=5){$('#skySuccess').textContent='A new constellation appears: The Aroohi. ✨';$('#next').disabled=false;confetti(55)}}
    function ending(){
      const bouquet=state.flowers.map(i=>flowers[i]?.name).filter(Boolean).join(', ');
      const route=state.pathChoices.map((n,i)=>storyChoices[i]?.[n]?.emoji||'✨').join(' ');
      scene(`<p class="eyebrow">The final page · a note just for you</p><div class="seal" aria-hidden="true">🎉</div>
        <h1 class="heading" style="font-size:clamp(2.8rem,6vw,5rem)">HAPPYYYY birthday,<br>${escapeHTML(config.name)}!</h1>
        <p class="lead" style="margin-inline:auto">Ten chapters. One birthday universe. A letter that was waiting for you the whole time.</p>
        <div class="tag">${escapeHTML(base[state.choices.base].name)} cake · ${escapeHTML(bouquet||'a little bouquet')} · ${route||'✨'} · a sky full of stars</div>
        <div class="letter">${escapeHTML(config.finalNote)}</div>
        <p class="signature">From ${escapeHTML(config.from)} ✨</p>
        <div class="btn-row"><button class="btn" id="cardDownload" type="button">⬇ Save the WHOLE birthday letter</button><button class="btn light" id="replay" type="button">↺ Play again</button></div>
        <p class="note">You can replay your little universe whenever you want.</p>`,'finale');
      $('#replay').onclick=()=>{state={...initial,choices:{...initial.choices},flowers:[],postcards:[],balloons:[],pathChoices:[]};save();goto(0)};
      $('#cardDownload').onclick=downloadCard;
    }
    function downloadCard(){
      const canvas=document.createElement('canvas'),width=1200;
      const c=canvas.getContext('2d');
      const size=32,lineHeight=48;
      c.font=`${size}px Georgia, serif`;
      const lines=wrapText(c,config.finalNote,850);
      const height=Math.max(1550,830+lines.length*lineHeight+250);
      canvas.width=width;canvas.height=height;
      const bg=c.createLinearGradient(0,0,width,height);
      bg.addColorStop(0,'#fce9ee');bg.addColorStop(1,'#e9e1ff');
      c.fillStyle=bg;c.fillRect(0,0,width,height);
      c.fillStyle='#fffaf5';roundRect(c,80,80,1040,height-160,55);c.fill();
      c.strokeStyle='#e4bfd4';c.lineWidth=3;c.setLineDash([12,12]);roundRect(c,110,110,980,height-220,42);c.stroke();c.setLineDash([]);
      for(let i=0;i<90;i++){c.fillStyle=['#f4bdcf','#dec4f4','#f7d28e'][i%3];c.beginPath();c.arc(145+(i*391)%910,140+(i*197)%(height-280),i%6===0?5:3,0,Math.PI*2);c.fill()}
      c.textAlign='center';c.fillStyle='#a26994';c.font='bold 29px system-ui';c.fillText('✦  A LITTLE BIRTHDAY UNIVERSE  ✦',600,225);
      c.font='110px serif';c.fillText('🎂',600,410);
      c.fillStyle='#392658';c.font='74px Georgia, serif';c.fillText('HAPPYYYY birthday,',600,540);
      c.fillStyle='#aa6595';c.font='italic 85px Georgia, serif';c.fillText(config.name+'!',600,640);
      c.strokeStyle='#e6c9dc';c.lineWidth=2;c.beginPath();c.moveTo(300,700);c.lineTo(900,700);c.stroke();
      c.fillStyle='#514363';c.font=`${size}px Georgia, serif`;c.textAlign='left';
      lines.forEach((line,i)=>c.fillText(line,175,775+i*lineHeight));
      c.textAlign='center';c.fillStyle='#a26994';c.font='italic 43px Georgia, serif';c.fillText('From '+config.from+' ✨',600,height-190);
      const a=document.createElement('a');a.download=`happy-birthday-${config.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.png`;
      a.href=canvas.toDataURL('image/png');a.click();tone(850,.22);
    }
    function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
    function wrapText(c,text,maxWidth){
      const lines=[];
      for(const paragraph of text.split(/\r?\n/)){
        if(!paragraph.trim()){lines.push('');continue}
        let line='';
        for(const word of paragraph.trim().split(/\s+/)){
          const trial=line?line+' '+word:word;
          if(c.measureText(trial).width>maxWidth&&line){lines.push(line);line=word}else line=trial;
        }
        if(line)lines.push(line);
      }
      return lines;
    }
    function openEditor(){
      const backdrop=document.createElement('div');backdrop.className='modal-backdrop';
      backdrop.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <h2 id="editor-title">Make every stop hers ✨</h2>
        <p class="note">Put in real moments and inside jokes. The downloaded HTML will contain your edits for everyone who visits the GitHub page.</p>
        <form id="editForm">
          <label class="field">Her name<input name="name" maxlength="35" required value="${escapeHTML(config.name)}"></label>
          <label class="field">From<input name="from" maxlength="50" required value="${escapeHTML(config.from)}"></label>
          <label class="field">Inside-joke nickname<input name="nickname" maxlength="70" value="${escapeHTML(config.nickname||'')}"></label>
          <label class="field">Opening line<textarea name="intro" maxlength="400" required>${escapeHTML(config.intro)}</textarea></label>
          <details open><summary>Three memory card messages</summary>${config.memories.map((m,i)=>`<label class="field">Memory ${i+1}<textarea name="memory${i}" maxlength="350" required>${escapeHTML(m)}</textarea></label>`).join('')}</details>
          <details><summary>Personal notes in all ten chapters</summary>${config.chapterNotes.map((m,i)=>`<label class="field">Chapter ${i+1} note<textarea name="chapter${i}" maxlength="400" required>${escapeHTML(m)}</textarea></label>`).join('')}</details>
          <details><summary>Four future postcards</summary>${config.postcards.map((m,i)=>`<label class="field">Postcard ${i+1}<textarea name="postcard${i}" maxlength="300" required>${escapeHTML(m)}</textarea></label>`).join('')}</details>
          <label class="field">Your complete final birthday letter<textarea name="finalNote" maxlength="5000" rows="17" required>${escapeHTML(config.finalNote)}</textarea></label>
          <div class="btn-row"><button class="btn" type="submit">Save & download game</button><button class="btn light" id="closeEditor" type="button">Close</button></div>
        </form></div>`;
      document.body.appendChild(backdrop);
      const close=()=>{backdrop.remove();$('#editBtn').focus()};
      $('#closeEditor').onclick=close;
      backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});
      backdrop.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
      backdrop.querySelector('input').focus();
      $('#editForm',backdrop).onsubmit=e=>{
        e.preventDefault();const data=new FormData(e.currentTarget);
        config={
          name:String(data.get('name')).trim(),from:String(data.get('from')).trim(),nickname:String(data.get('nickname')).trim(),intro:String(data.get('intro')).trim(),
          memories:[0,1,2].map(i=>String(data.get('memory'+i)).trim()),
          chapterNotes:Array.from({length:10},(_,i)=>String(data.get('chapter'+i)).trim()),
          postcards:Array.from({length:4},(_,i)=>String(data.get('postcard'+i)).trim()),
          finalNote:String(data.get('finalNote')).trim()
        };
        configNode.textContent=JSON.stringify(config).replace(/</g,'\\u003c');
        document.title=`${config.name} and the Little Birthday Universe`;
        close();render();
        document.body.classList.remove('edit-mode');
        const html='<!doctype html>\n'+document.documentElement.outerHTML;
        document.body.classList.add('edit-mode');
        const blob=new Blob([html],{type:'text/html;charset=utf-8'});
        const url=URL.createObjectURL(blob),link=document.createElement('a');
        link.href=url;link.download='index.html';link.click();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
      };
    }
    $('#soundBtn').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♫ Sound on':'♫ Sound off';e.currentTarget.setAttribute('aria-pressed',String(sound));tone(660)};
    if(new URLSearchParams(location.search).has('edit')){document.body.classList.add('edit-mode');$('#editBtn').onclick=openEditor}
    const sky=$('#sky');for(let i=0;i<50;i++){const star=document.createElement('span');star.className='twinkle';star.textContent=i%6===0?'✦':'·';star.style.cssText=`--x:${(i*59.7)%100}%;--y:${(i*31.3+7)%100}%;--s:${i%6===0?12:17}px;--d:${2+i%5}s;--delay:-${i%7}s`;sky.appendChild(star)}
    render();
  })();
  </script>
</body>
</html>
